[project]
name = "spatialize-api"
version = "0.1.0"
description = "Validated plan ingestion and media orchestration API for Spatialize"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "genblaze>=0.4,<1",
  "genblaze-assemblyai>=0.3,<1",
  "genblaze-google>=0.3,<1",
  "google-genai>=1.30,<2",
  "kokoro-onnx>=0.5,<1",
  "langchain-google-genai>=4.0,<5",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatialize_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
