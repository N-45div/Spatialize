services:
  - type: web
    name: spatialize
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPATIALIZE_STORAGE_BACKEND
        value: b2
      - key: B2_BUCKET
        value: spatialize
      - key: B2_REGION
        value: us-east-005
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SPATIALIZE_OPENROUTER_MODEL
        value: google/gemini-3.6-flash
      - key: SPATIALIZE_STT_MODEL
        value: universal-3-5-pro
      - key: SPATIALIZE_ALLOWED_ORIGINS
        sync: false
      # Access desk: evidence lives in Sanity; the agent reads a Context Knowledge Base.
      - key: SANITY_PROJECT_ID
        value: tubqyqod
      - key: SANITY_DATASET
        value: production
      - key: SANITY_API_TOKEN
        sync: false
      - key: SANITY_CONTEXT_URL
        value: https://api.sanity.io/v1/context/organizations/ottnv0qew/mcp/spatialize-access-evidence
      - key: SANITY_CONTEXT_TOKEN
        sync: false
